<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事件完整时间线 · GDELT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><div class="shell nav"><a class="logo" href="./"><b>GDELT</b><span>EVENT DOSSIER</span></a><nav><a href="./">返回观察台</a></nav></div></header>
  <main class="shell dossier"><p class="eyebrow">FULL EVENT LINE / 完整事件线</p><div id="content"><div class="empty">正在读取事件档案…</div></div></main>
  <script>
    const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safe=x=>{try{const u=new URL(x);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}},date=x=>{if(!x)return'—';const m=String(x).match(/^(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?/);return m?`${m[1]}-${m[2]}-${m[3]}${m[4]?` ${m[4]}:${m[5]||'00'}`:''} UTC`:String(x).replace('T',' ').replace('+00:00',' UTC').replace(/ UTC UTC$/,' UTC')};
    function highlight(text, terms){let out=esc(text||'暂无内容');[...new Set(terms.filter(Boolean).sort((a,b)=>b.length-a.length))].forEach(term=>{const safeTerm=String(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');out=out.replace(new RegExp(`(${safeTerm})`,'ig'),'<mark>$1</mark>')});return out}
    function fieldRow(field,label,value,terms){const present=value!==undefined&&value!==null&&String(value).trim();return`<div class="evidence-field"><b>${esc(label)}</b><span>${present?highlight(String(value),terms):'暂无值'}</span><button class="field-help" type="button" title="${esc(field)}：字段值在当前可核查文本中的定位说明">?</button><span class="field-explanation" hidden>${esc(field)}：字段值已在当前快照文本中高亮；如未出现，请打开原文核查。</span></div>`}
    async function load(){try{const params=new URLSearchParams(location.search);const id=params.get('id');const focus=params.get('field');const data=await (await fetch('data/latest.json?v='+Date.now())).json();const e=(data.top_news||[]).find(x=>x.id===id)||(data.top_news||[])[0];if(!e)throw Error('event not found');const href=safe(e.url),text=[e.title||'',e.summary||''].join(' '),places=(e.locations||[]).map(p=>p.name),themes=e.themes||[],persons=e.entities?.persons?[e.entities.persons]:'',orgs=e.entities?.organizations?[e.entities.organizations]:'';const terms=[...places,...themes,...persons,...orgs];$('content').innerHTML=`<h1>${highlight(e.title||'未命名报道',terms)}</h1><p class="dek">${highlight(e.summary||'暂无摘要',terms)}</p><div class="drawer-meta"><b>${esc(e.source_name||e.source||'未知出处')}</b><span>${date(e.date)}</span><span>影响分 ${e.score||0}</span></div><section class="panel" id="evidence"><h2>当前新闻字段与正文出处 <button class="info-button" type="button" title="点击字段值可定位到下方标题或摘要中的首次出现；原文链接仍指向发布媒体正文。">?</button></h2><p class="notice">本页用当前快照保存的标题和摘要作为可核查文本；字段值会在其中用色块标出。若原文正文未被 GDELT 快照保存，则通过原文链接继续核查。</p><div class="evidence-fields">${fieldRow('SourceCommonName','来源',e.source_name||e.source||'', [e.source_name||e.source])}${fieldRow('DATE','时间',e.date,[e.date])}${fieldRow('DocumentIdentifier','原文',e.url,[])}${fieldRow('V2Locations','地点',places.join('、'),places)}${fieldRow('V2Themes','主题',themes.join('、'),themes)}${fieldRow('V2Persons','人物',e.entities?.persons,persons)}${fieldRow('V2Organizations','机构',e.entities?.organizations,orgs)}${fieldRow('AvgTone','影响分',e.score,[String(e.score)])}</div><p class="notice">当前定位字段：${esc(focus||'—')} · 文本长度 ${text.length} 字符</p>${href?`<a class="source-link" target="_blank" rel="noopener" href="${href}">打开发布媒体原文 ↗</a>`:''}</section><section class="panel"><h2>事件完整时间线</h2><ol class="eventline"><li><b>${date(e.date)}</b><span>新闻信号进入 GKG<small>${esc(e.source_name||'未知出处')} · ${esc(e.title||'')}</small></span></li>${(e.locations||[]).map(p=>`<li><b>地点识别</b><span>${esc(p.name)}<small>${esc(p.country)}</small></span></li>`).join('')}<li><b>三库支撑</b><span>Events · GKG · Mentions<small>本事件来自当前快照，原始数据可从观察台底部打开</small></span></li></ol></section>`}catch(err){$('content').innerHTML='<div class="empty">找不到该事件档案。</div>';console.error(err)}}document.addEventListener('click',e=>{const b=e.target.closest('.field-help');if(!b)return;const explanation=b.parentElement.querySelector('.field-explanation');if(explanation){explanation.hidden=!explanation.hidden;b.setAttribute('aria-expanded',String(!explanation.hidden))}});load();
  </script>
</body>
</html>
