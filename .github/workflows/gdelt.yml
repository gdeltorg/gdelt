name: Analyze GDELT

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_gdelt.py'
      - '.github/workflows/gdelt.yml'

permissions:
  contents: write

concurrency:
  group: gdelt-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and analyze GDELT
        run: python scripts/analyze_gdelt.py

      - name: Commit latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'Update GDELT analytics snapshot'
            git push
          fi
