name: Analyze GDELT

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_gdelt.py'
      - 'scripts/analyze_tv_gkg.py'
      - '.github/workflows/gdelt.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: gdelt-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate latest snapshot and append history
        run: python scripts/analyze_gdelt.py
      - name: Generate TV-GKG video statistics
        env:
          JEV_LIVE_EVAL: ${{ secrets.TYPESAFE_API_KEY != '' && '1' || '0' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python scripts/analyze_tv_gkg.py
      - name: Commit snapshot and archive
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/archive data/video.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Update GDELT historical snapshot'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated snapshot to Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            })
