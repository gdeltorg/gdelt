name: Analyze GDELT

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_gdelt.py'
      - '.github/workflows/gdelt.yml'

permissions:
  contents: write

concurrency:
  group: gdelt-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate latest snapshot and append history
        run: python scripts/analyze_gdelt.py
      - name: Commit snapshot and archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/history.json data/archive
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Update GDELT historical snapshot'
            git push
          fi
