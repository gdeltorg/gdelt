name: Analyze current TV video

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_tv_gkg.py'
      - '.github/workflows/video.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: gdelt-video-analysis
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate complete current TV video snapshot
        env:
          JEV_LIVE_EVAL: ${{ secrets.TYPESAFE_API_KEY != '' && '1' || '0' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python scripts/analyze_tv_gkg.py
      - name: Commit video snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/video.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Update current TV video snapshot'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy video snapshot to Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            });
