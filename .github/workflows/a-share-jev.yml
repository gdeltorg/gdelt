name: Evaluate China A-share direction with Jev

on:
  schedule:
    - cron: '20 7-9 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_a_share_jev.py'
      - '.github/workflows/a-share-jev.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: a-share-jev
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch quotes and evaluate with TypeSafe Jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python scripts/analyze_a_share_jev.py
      - name: Commit snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/a_share_jev.json
          if git diff --cached --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else git commit -m 'Update China A-share Jev example'; echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
          git push
      - name: Deploy Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'pages.yml', ref: 'main'});
