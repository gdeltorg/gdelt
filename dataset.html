<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>数据集明细 · GDELT</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><div class="shell nav"><a class="logo" href="./"><b>GDELT</b><span>DATASET DETAIL</span></a><nav><a href="data.html">返回数据支撑层</a><a href="./">返回首页</a></nav></div></header><main class="shell"><section class="data-hero"><p class="eyebrow">EVIDENCE LAYER / 三级数据界面</p><h1 id="title">数据集明细</h1><p id="intro" class="dek">正在读取……</p></section><section class="data-grid" id="stats"></section><section class="panel data-table"><div class="section-head"><div><p class="eyebrow">RAW SUPPORT</p><h2>原始数据入口</h2></div><span id="file">—</span></div><p class="notice">此页用于核查，不替代首页的专题阅读。行数是当前文件原始行数，日期和字段遵循 GDELT 原始格式。</p><p id="links"></p></section></main><footer class="shell footer"><span>数据支撑层 · 三级明细</span><a href="data.html">返回数据室 ↗</a></footer><script>
const $=x=>document.getElementById(x),fmt=x=>Number(x||0).toLocaleString('zh-CN'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>{const m=String(x||'').match(/^(\d{4})(\d{2})(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]} UTC`:String(x||'—')};const schema={events:{title:'Events · 事件库',intro:'结构化全球事件记录：参与者、行为、地点、事件代码和来源。'},gkg:{title:'GKG · 知识图谱',intro:'文章级知识图谱：来源、主题、地点、人物、机构和原文标识。'},mentions:{title:'Mentions · 提及库',intro:'事件在新闻中的传播提及：提及时间、来源、文章和置信度。'}};async function load(){const n=new URLSearchParams(location.search).get('name')||'events',s=schema[n]||schema.events,d=await(await fetch('data/latest.json?v='+Date.now())).json(),x=d.datasets?.[n]||{};$('title').textContent=s.title;$('intro').textContent=s.intro;$('file').textContent=x.file||'—';$('stats').innerHTML=`<article class="data-card"><p class="eyebrow">CURRENT SNAPSHOT</p><h2>当前快照</h2><div class="big">${fmt(x.records)} <small>行</small></div></article><article class="data-card"><p class="eyebrow">CURRENT DAY</p><h2>当天</h2><div class="big">${fmt(x.current_records)} <small>行</small></div><p class="notice">${date(d.current_day)}</p></article><article class="data-card"><p class="eyebrow">COVERAGE</p><h2>时间覆盖</h2><div class="big">${fmt(x.time_points)} <small>个时间点</small></div><p class="notice">${date(x.date_start)} — ${date(x.date_end)}</p></article>`;$('links').innerHTML=`<a class="source-link" target="_blank" href="https://data.gdeltproject.org/gdeltv2/${esc(x.file)}">打开原始文件 ↗</a>`}load().catch(e=>{$('intro').textContent='无法读取数据集';console.error(e)});
</script></body></html>
